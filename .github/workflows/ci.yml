name: Arunachala Dashboard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Server Validation & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Dependencies
        run: npm ci || npm install
      - name: Syntax Check Server
        run: node --check server.js || true
      - name: Node tests (Access token gate, agent runs reader)
        run: npm test
      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true
      - name: Verify PowerShell Script Syntax
        shell: pwsh
        run: |
          foreach ($script in './telemetry-daemon.ps1', './install-teammate.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error::${script}: $_" }
              exit 1
            }
            if (Select-String -Path $script -Pattern '[^\x00-\x7F]' -Quiet) {
              Write-Host "::error::${script}: non-ASCII characters break Windows PowerShell 5.1"
              exit 1
            }
            Write-Host "${script}: no syntax errors, ASCII only."
          }

      - name: Agent stats tests
        shell: pwsh
        run: ./agent-stats.test.ps1
