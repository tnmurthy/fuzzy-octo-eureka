<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context - Arunachala Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body { background: var(--bg-primary); color: var(--color-text-main); font-family: 'Outfit', sans-serif; margin: 0; }
    .page { max-width: 1240px; margin: 0 auto; padding: 28px 16px 60px; }
    .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .head h1 { font-size: 1.6rem; font-weight: 600; margin: 0; }
    .nav a { color: var(--status-blue); text-decoration: none; font-size: 0.85rem; margin-left: 16px; }
    .muted { color: var(--color-text-muted); font-size: 0.8rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .card h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 12px; }
    .note { border-left: 3px solid var(--status-amber); padding: 8px 12px; margin-bottom: 16px; font-size: 0.85rem; background: var(--status-amber-glow); border-radius: 6px; }
    .note[hidden] { display: none; }

    .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .tile { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 16px; }
    .tile .n { font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tile .l { font-size: 0.75rem; color: var(--color-text-muted); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; font-weight: 500; color: var(--color-text-muted); font-size: 0.74rem; padding: 6px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    td.num { font-variant-numeric: tabular-nums; text-align: right; }
    th.num { text-align: right; }
    .you { font-size: 0.68rem; color: var(--status-blue); border: 1px solid rgba(0,176,255,.4); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
    .role-owner { color: var(--status-amber); }

    .mem-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs { display: inline-flex; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 3px; gap: 3px; }
    .tab { background: transparent; border: 0; color: var(--color-text-muted); font: inherit; font-size: 0.85rem; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    .tab[aria-selected="true"] { background: var(--bg-card-hover); color: var(--color-text-main); }
    .tab .c { font-size: 0.72rem; opacity: .7; margin-left: 4px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters input, .filters select { background: var(--bg-secondary); color: var(--color-text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 0.85rem; }
    .filters input { width: 220px; max-width: 100%; }
    .tab-help { margin: -4px 0 12px; }

    .mem { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg-secondary); cursor: pointer; }
    .mem:hover { border-color: var(--border-color-glow); }
    .mem .t { font-weight: 500; font-size: 0.92rem; }
    .mem .b { font-size: 0.83rem; color: #c3cedb; margin-top: 6px; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mem.open .b { display: block; -webkit-line-clamp: unset; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
    .badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-color); color: var(--color-text-muted); }
    .b-local { color: var(--status-amber); border-color: rgba(255,179,0,.4); }
    .b-synced { color: var(--status-green); border-color: rgba(0,230,118,.4); }
    .b-team { color: var(--status-blue); border-color: rgba(0,176,255,.4); }
    .b-private { color: #c4a7ff; border-color: rgba(179,136,255,.45); }
    .empty { color: var(--color-text-muted); font-size: 0.85rem; padding: 10px 0; }
    .more { display: block; margin: 8px auto 0; }
    .btn-sm { background: transparent; color: var(--status-blue); border: 1px solid rgba(0,176,255,.35); border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 0.8rem; cursor: pointer; }
  </style>
</head>
<body>
  <main class="page">
    <div class="head">
      <div>
        <h1>Context</h1>
        <div class="muted" id="subtitle">Who is on the team and what the agents know.</div>
      </div>
      <div class="nav"><a href="/onboarding">🚀 Onboarding</a><a href="/agents">🤖 Agents</a><a href="/">← Dashboard</a></div>
    </div>

    <div class="note" id="note" hidden></div>

    <section class="tiles" aria-label="Totals">
      <div class="tile"><div class="n" id="t-members">-</div><div class="l">Team members</div></div>
      <div class="tile"><div class="n" id="t-mine">-</div><div class="l">My memories</div></div>
      <div class="tile"><div class="n" id="t-private">-</div><div class="l">🔒 Private to me</div></div>
      <div class="tile"><div class="n" id="t-shared">-</div><div class="l">Shared with team</div></div>
      <div class="tile"><div class="n" id="t-team">-</div><div class="l">From teammates</div></div>
      <div class="tile"><div class="n" id="t-combined">-</div><div class="l">Combined (unique)</div></div>
    </section>

    <section class="card">
      <h2>Team members</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Role</th><th class="num">Shared memories</th><th class="num">Agent runs</th><th>Last run</th><th class="num">AI calls (7d)</th><th class="num">Tokens (7d)</th><th>Joined</th></tr></thead>
          <tbody id="members"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="mem-bar">
        <div class="tabs" role="tablist" aria-label="Memory view">
          <button class="tab" role="tab" data-view="mine" aria-selected="false">Mine<span class="c" id="c-mine"></span></button>
          <button class="tab" role="tab" data-view="shared" aria-selected="false">Shared<span class="c" id="c-shared"></span></button>
          <button class="tab" role="tab" data-view="combined" aria-selected="true">Combined<span class="c" id="c-combined"></span></button>
        </div>
        <div class="filters">
          <input type="search" id="q" placeholder="Search memory…" aria-label="Search memory">
          <select id="project" aria-label="Project"><option value="">All projects</option></select>
        </div>
      </div>
      <div class="muted tab-help" id="tab-help"></div>
      <div id="memory"><div class="empty">Loading…</div></div>
      <button class="btn-sm more" id="more" type="button" hidden>Show more</button>
    </section>
  </main>
  <script src="context-page.js"></script>
</body>
</html>
